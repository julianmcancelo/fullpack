# ML Pro Suite — propiedades de build.
# Ojo: no se usa android.defaults.buildfeatures.buildconfig; buildConfig y compose
# se habilitan explícitamente en app/build.gradle.kts.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# JDK de compilación. Android Studio trae su propio JBR (Java 25) y AGP 8.13 no lo
# soporta, así que fijamos el JDK 17 instalado en esta máquina. Si movés el proyecto,
# borrá esta línea o apuntala al JDK 17 de la nueva máquina.
org.gradle.java.home=C\:\\Users\\Julian\\jdk-17

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
